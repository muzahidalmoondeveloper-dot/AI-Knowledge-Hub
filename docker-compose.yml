services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    container_name: ai_knowledge_hub_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ai_knowledge_hub

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_knowledge_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: